<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>UE — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Unités d\'enseignement')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>Choisir un semestre</h2>
    <form th:action="@{/screens/course-units}" method="get">
      <select name="semesterId" onchange="this.form.submit()">
        <option value="">-- Sélectionner --</option>
        <option th:each="semester : ${semesters}" th:value="${semester.id}"
                th:selected="${semester.id == selectedSemesterId}"
                th:text="'Semestre ' + ${semester.number}"></option>
      </select>
    </form>
  </section>

  <section th:if="${selectedSemesterId != null}">
    <h2>Nouvelle UE</h2>
    <form th:action="@{/screens/course-units}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" name="semesterId" th:value="${selectedSemesterId}" />

      <label for="code">Code</label>
      <input type="text" id="code" name="code" required maxlength="20" />

      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required maxlength="150" />

      <label for="credits">Crédits</label>
      <input type="number" id="credits" name="credits" required min="1" />

      <button type="submit">Créer</button>
    </form>

    <h2>UE du semestre</h2>
    <table>
      <thead><tr><th>Code</th><th>Nom</th><th>Crédits</th></tr></thead>
      <tbody>
      <tr th:each="cu : ${courseUnits}">
        <td th:text="${cu.code}">UE1</td>
        <td th:text="${cu.name}">Algorithmique</td>
        <td th:text="${cu.credits}">6</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(courseUnits)}">Aucune UE pour ce semestre.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
