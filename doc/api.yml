openapi: 3.1.0
info:
  title: HEI Academic Records API
  description: >
    Shared contract for the HEI academic records management project. The API is
    stateless and JWT-secured: a single bearer token issued by `POST /auth/login`
    authenticates across the three separate account tables (Student, Teacher,
    Admin).

    Academic Structure & Administration Module (Valisoa): Security/Auth,
    AcademicYear, Cohort, Semester, Program, Group, GroupMembership, CourseUnit,
    Course, TeachingAssignment, Teacher, Admin, Student.

    Assessment & Transcripts Module (Fenohasina): Exam, Grade, GradeHistory,
    Transcript.

    All paths share the `ErrorResponse` envelope defined in `error-api.yml`.
  version: 1.0.0
  license:
    name: Proprietary
  contact:
    name: HEI Academic Affairs Team
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Security
    description: Authentication and health endpoints.
  - name: AcademicYear
    description: Academic Year.
  - name: Cohort
    description: Promotion (year of entry).
  - name: Semester
    description: Semester, with its 30-credit structure rule.
  - name: Program
    description: Journey.
  - name: Group
    description: Group of students and its program history.
  - name: GroupMembership
    description: A student's membership in a group.
  - name: CourseUnit
    description: Course Unit(UE).
  - name: Course
    description: Course, and its attachment to course units.
  - name: TeachingAssignment
    description: Assigning a teacher to a class for a group.
  - name: Student
    description: Student accounts.
  - name: Teacher
    description: Teacher accounts.
  - name: Admin
    description: Administrator accounts.
  - name: Exam
    description: Exam, with its weighting budget rule.
  - name: Grade
    description: Notes et average.
  - name: GradeHistory
    description: History des modifications de notes.
  - name: Transcript
    description: Transcript (PDF generated asynchronously).

paths:
  /ping:
    $ref: './security-api.yml#/paths/~1ping'
  /auth/login:
    $ref: './security-api.yml#/paths/~1auth~1login'

  /academic-years:
    $ref: './academicyear-api.yml#/paths/~1academic-years'
