<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Affectations — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Affectations d\'enseignement')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>Nouvelle affectation</h2>
    <form th:action="@{/screens/teaching-assignments}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <label for="teacherId">Identifiant enseignant (UUID)</label>
      <input type="text" id="teacherId" name="teacherId" required
             placeholder="ex: 3fa85f64-5717-4562-b3fc-2c963f66afa6" />

      <label for="courseId">Cours</label>
      <select id="courseId" name="courseId" required>
        <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.reference} + ' — ' + ${course.title}"></option>
      </select>

      <label for="groupId">Groupe</label>
      <select id="groupId" name="groupId" required>
        <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.reference}"></option>
      </select>

      <button type="submit">Créer</button>
    </form>
  </section>

  <section>
    <h2>Affectations existantes</h2>
    <table>
      <thead><tr><th>Enseignant</th><th>Cours</th><th>Groupe</th></tr></thead>
      <tbody>
      <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.teacherId}">-</td>
        <td th:text="${assignment.courseId}">-</td>
        <td th:text="${assignment.groupId}">-</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(assignments)}">Aucune affectation pour le moment.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
