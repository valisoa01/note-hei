paths:
  /academic-years:
    post:
      operationId: createAcademicYear
      summary: Create an academic year
      description: Creates an academic year. Admin only.
      tags: [AcademicYear]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYear'
      responses:
        '201':
          description: Academic year created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
        '400':
          $ref: './error-api.yml#/components/responses/BadRequest'
        '401':
          $ref: './error-api.yml#/components/responses/Unauthorized'
        '403':
          $ref: './error-api.yml#/components/responses/Forbidden'
        '422':
          $ref: './error-api.yml#/components/responses/UnprocessableEntity'

    get:
      operationId: listAcademicYears
      summary: List academic years
      description: All authenticated roles may list academic years.
      tags: [AcademicYear]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of academic years.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
        '401':
          $ref: './error-api.yml#/components/responses/Unauthorized'

  /academic-years/{id}:
    get:
      operationId: getAcademicYear
      summary: Get one academic year
      description: All authenticated roles may read a single academic year.
      tags: [AcademicYear]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The academic year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
        '401':
          $ref: './error-api.yml#/components/responses/Unauthorized'
        '404':
          $ref: './error-api.yml#/components/responses/NotFound'

    delete:
      operationId: deleteAcademicYear
      summary: Delete an academic year
      description: Deletes an academic year. Admin only.
      tags: [AcademicYear]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Academic year deleted.
        '401':
          $ref: './error-api.yml#/components/responses/Unauthorized'
        '403':
          $ref: './error-api.yml#/components/responses/Forbidden'
        '404':
          $ref: './error-api.yml#/components/responses/NotFound'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID of the academic year.
      schema:
        type: string
        format: uuid

  schemas:
    AcademicYear:
      type: object
      required: [name, startYear, endYear]
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated id.
          readOnly: true
        name:
          type: string
          example: '2025-2026'
        startYear:
          type: integer
          example: 2025
        endYear:
          type: integer
          example: 2026