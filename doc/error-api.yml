components:
  schemas:
    ErrorCode:
      type: string
      description: >
        Stable, machine-readable business error code. Values are aligned with
        `com.example.demo.exception` and grouped by the HTTP status they map to.
        The API never returns a raw stack trace, only the `code` plus a human
        readable `message`.
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - FORBIDDEN
        - ACADEMIC_YEAR_NOT_FOUND
        - ADMIN_NOT_FOUND
        - COHORT_NOT_FOUND
        - COURSE_UNIT_NOT_FOUND
        - GROUP_NOT_FOUND
        - PROGRAM_NOT_FOUND
        - SEMESTER_NOT_FOUND
        - STUDENT_NOT_FOUND
        - TEACHER_NOT_FOUND
        - TEACHING_ASSIGNMENT_NOT_FOUND
        - EMAIL_ALREADY_USED
        - ACADEMIC_YEAR_VALIDATION_FAILED
        - COHORT_VALIDATION_FAILED
        - COURSE_UNIT_VALIDATION_FAILED
        - COURSE_VALIDATION_ERROR
        - EXAM_VALIDATION_FAILED
        - GRADE_VALIDATION_FAILED
        - GROUP_MEMBERSHIP_VALIDATION_FAILED
        - GROUP_PROGRAM_HISTORY_VALIDATION_FAILED
        - GROUP_VALIDATION_FAILED
        - PROGRAM_VALIDATION_FAILED
        - SEMESTER_VALIDATION_FAILED
        - TEACHING_ASSIGNMENT_VALIDATION_FAILED
        - TRANSCRIPT_VALIDATION_FAILED
        - INTERNAL_ERROR

    FieldError:
      type: object
      description: Single field-level violation, present only in `details` for 400 responses.
      required: [field, message]
      properties:
        field:
          type: string
          example: matricule
        message:
          type: string
          example: must follow the STDyynnn format

    ErrorResponse:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 422
        error:
          type: string
          description: Standard HTTP reason phrase.
          example: Unprocessable Entity
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: 'Sum of course_unit_course credits (18) must equal course_unit.credits (30) for course unit 9f1e2b3c-...'
        path:
          type: string
          example: /api/courses/course-units/9f1e2b3c-.../attach
        details:
          type: array
          description: Present only for field-level validation failures (400).
          items:
            $ref: '#/components/schemas/FieldError'

  responses:
    BadRequest:
      description: >
        Malformed request body or field-level validation failure
        (code `VALIDATION_FAILED`, with one `FieldError` per failing field in `details`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: >
        Missing, invalid or expired bearer token (code `UNAUTHORIZED`), or wrong
        credentials on `POST /auth/login` (code `INVALID_CREDENTIALS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >
        Authenticated, but the account role is not allowed on this route
        (code `FORBIDDEN`). Fine-grained ownership failures raised by domain
        validators surface as 403 via the same handler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The requested resource does not exist (code `*_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: >
        The request conflicts with the current state of the data, e.g. a duplicate
        unique value (code `EMAIL_ALREADY_USED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: >
        Well-formed request that violates a domain business rule
        (code `*_VALIDATION_FAILED` or `COURSE_VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: >
        Unexpected server error (code `INTERNAL_ERROR`). No stack trace is ever exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'