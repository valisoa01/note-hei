<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Saisie des notes — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Saisie des notes')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>1. Choisir un cours</h2>
    <form th:action="@{/screens/grades}" method="get">
      <select name="courseId" onchange="this.form.submit()">
        <option value="">-- Sélectionner un de vos cours --</option>
        <option th:each="a : ${assignments}" th:value="${a.courseId}"
                th:selected="${a.courseId == selectedCourseId}"
                th:text="${a.courseId}"></option>
      </select>
    </form>
    <p th:if="${#lists.isEmpty(assignments)}">Vous n'avez aucune affectation d'enseignement.</p>
  </section>

  <section th:if="${selectedCourseId != null}">
    <h2>2. Saisir une note</h2>
    <form th:action="@{/screens/grades}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <label for="examId">Examen</label>
      <select id="examId" name="examId" required>
        <option th:each="exam : ${exams}" th:value="${exam.id}"
                th:text="${exam.type} + ' (' + ${exam.weighting} + '%)'"></option>
      </select>

      <label for="studentMatricule">Matricule étudiant</label>
      <input type="text" id="studentMatricule" name="studentMatricule" required
             placeholder="STD25001" />

      <label for="value">Note (/20)</label>
      <input type="number" id="value" name="value" step="0.01" min="0" max="20" required />

      <button type="submit">Enregistrer</button>
    </form>
    <p th:if="${#lists.isEmpty(exams)}">Aucun examen défini pour ce cours.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
