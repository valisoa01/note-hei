<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Connexion — NoteHEI</title>
</head>
<body>
<main class="login-page">
  <h1>Connexion</h1>

  <p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>
  <p th:if="${logoutMessage}" th:text="${logoutMessage}" class="info"></p>

  <form th:action="@{/login}" method="post">
    <!-- CSRF token, injected automatically by thymeleaf-extras-springsecurity6 -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus />
    </div>

    <div>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required />
    </div>

    <button type="submit">Se connecter</button>
  </form>
</main>
</body>
</html>
