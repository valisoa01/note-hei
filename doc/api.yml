    $ref: './academicyear-api.yml#/paths/~1academic-years~1{id}'

  /cohorts:
    $ref: './cohort-api.yml#/paths/~1cohorts'
  /cohorts/{id}:
    $ref: './cohort-api.yml#/paths/~1cohorts~1{id}'

  /semesters:
    $ref: './semester-api.yml#/paths/~1semesters'
  /semesters/{id}:
    $ref: './semester-api.yml#/paths/~1semesters~1{id}'
  /semesters/{id}/credit-structure-complete:
    $ref: './semester-api.yml#/paths/~1semesters~1{id}~1credit-structure-complete'

  /programs:
    $ref: './program-api.yml#/paths/~1programs'
