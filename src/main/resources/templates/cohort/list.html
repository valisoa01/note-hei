<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Promotions — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Promotions')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>Nouvelle promotion</h2>
    <form th:action="@{/screens/cohorts}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label for="entryYear">Année d'entrée</label>
      <input type="number" id="entryYear" name="entryYear" required min="2000" max="2100" />
      <button type="submit">Créer</button>
    </form>
  </section>

  <section>
    <h2>Promotions existantes</h2>
    <table>
      <thead>
      <tr><th>Année d'entrée</th></tr>
      </thead>
      <tbody>
      <tr th:each="cohort : ${cohorts}">
        <td th:text="${cohort.entryYear}">2024</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(cohorts)}">Aucune promotion pour le moment.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
