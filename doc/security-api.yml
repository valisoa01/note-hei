paths:
  /ping:
    get:
      operationId: ping
      summary: Health check
      description: Public endpoint used to verify the API is reachable. No authentication required.
      tags: [Security]
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /auth/login:
    post:
      operationId: login
      summary: Authenticate a Student, Teacher or Admin account
      description: >
        Authenticates against the three separate account tables (Student, Teacher,
        Admin) by email + password and returns a signed JWT plus the resolved
        account identity. The client does not need to know in advance which table
        the account belongs to — lookup order is Admin, Student, Teacher. Passwords
        are verified with BCrypt; they are never stored or returned in clear.
      tags: [Security]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: './error-api.yml#/components/responses/BadRequest'
        '401':
          $ref: './error-api.yml#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by POST /auth/login. Must be sent as
        `Authorization: Bearer {token}` on every protected route.
        Stateless: no server-side session is kept for REST routes.

  schemas:
    AccountType:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
      description: >
        Which of the three account tables the authenticated user belongs to.
        Student, Teacher and Admin are always separate tables, never merged
        into a single User/Role table.

    Role:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
      description: >
        Role carried by the authenticated account, as returned by login
        (`LoginResponse.role`) and inside the JWT `role` claim. Spring Security
        prefixes it to build the authority, e.g. role `STUDENT` -> authority
        `ROLE_STUDENT`, which is what `@PreAuthorize("hasRole('STUDENT')")`
        checks.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: student@hei.school
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100

    LoginResponse:
      type: object
      required: [token, id, email, firstName, lastName, role]
      properties:
        token:
          type: string
          description: Signed JWT bearer token.
          example: eyJhbGciOiJIUzI1NiJ9...
        id:
          type: string
          format: uuid
          description: Account id (student, teacher or admin).
        email:
          type: string
          format: email
        firstName:
          type: string
          example: Valisoa
        lastName:
          type: string
          example: Randria
        role:
          $ref: '#/components/schemas/Role'

    JwtClaims:
      type: object
      description: >
        Documentation-only: shape of the JWT payload issued by the API. Not
        exposed as an HTTP schema, useful as a reference for JwtService.
      properties:
        sub:
          type: string
          format: email
          description: Account email (JWT subject).
        id:
          type: string
          format: uuid
          description: Account id.
        role:
          $ref: '#/components/schemas/Role'
        iat:
          type: integer
          description: Issued-at (epoch seconds).
        exp:
          type: integer
          description: Expiration (epoch seconds). Short-lived token, no refresh token in v1.