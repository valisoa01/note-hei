<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Groupes — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Groupes')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>Nouveau groupe</h2>
    <form th:action="@{/screens/groups}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <label for="reference">Référence</label>
      <input type="text" id="reference" name="reference" required maxlength="20" />

      <label for="cohortId">Promotion</label>
      <select id="cohortId" name="cohortId" required>
        <option th:each="cohort : ${cohorts}" th:value="${cohort.id}" th:text="${cohort.entryYear}"></option>
      </select>

      <button type="submit">Créer</button>
    </form>
  </section>

  <section>
    <h2>Groupes existants</h2>
    <table>
      <thead><tr><th>Référence</th><th>Promotion</th><th></th></tr></thead>
      <tbody>
      <tr th:each="group : ${groups}">
        <td th:text="${group.reference}">G1</td>
        <td th:text="${group.cohortId}">-</td>
        <td><a th:href="@{/screens/groups/{id}(id=${group.id})}">Détail / Parcours</a></td>
      </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(groups)}">Aucun groupe pour le moment.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
