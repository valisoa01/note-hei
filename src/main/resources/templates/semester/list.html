<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Semestres — NoteHEI</title>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='Semestres')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <section>
    <h2>Nouveau semestre</h2>
    <form th:action="@{/screens/semesters}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <label for="number">Numéro (1 à 6)</label>
      <input type="number" id="number" name="number" min="1" max="6" required />

      <label for="cohortId">Promotion</label>
      <select id="cohortId" name="cohortId" required>
        <option th:each="cohort : ${cohorts}" th:value="${cohort.id}" th:text="${cohort.entryYear}"></option>
      </select>

      <label for="academicYearId">Année universitaire</label>
      <select id="academicYearId" name="academicYearId" required>
        <option th:each="year : ${academicYears}" th:value="${year.id}" th:text="${year.name}"></option>
      </select>

      <button type="submit">Créer</button>
    </form>
  </section>

  <section>
    <h2>Semestres existants</h2>
    <table>
      <thead>
      <tr><th>Numéro</th><th>Promotion</th><th>Année universitaire</th></tr>
      </thead>
      <tbody>
      <tr th:each="semester : ${semesters}">
        <td th:text="${semester.number}">1</td>
        <td th:text="${semester.cohortId}">-</td>
        <td th:text="${semester.academicYearId}">-</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(semesters)}">Aucun semestre pour le moment.</p>
  </section>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
